# Paths inside the container
library_dir: /library              # each creator gets a subfolder here
cookies_file: /config/cookies.txt  # Netscape cookies.txt exported from a logged-in browser
data_dir: /data                    # per-creator state.json and temporary files

interval_minutes: 60

# Throttling, so a large backlog looks less like a scraper.
# Max download speed (yt-dlp syntax: "4M" = 4 MiB/s; omit for unlimited) and a random
# pause between videos in seconds ([min, max], or one number).
rate_limit: 4M
pause_seconds: [60, 180]

# Uptime Kuma push URL; called with status=up/down after every run.
# heartbeat_url: https://uptime.example.com/api/push/XXXXXXXX

# Plex: used to trigger a library scan after new downloads, and to find watched episodes.
# plex:
#   url: http://10.11.12.16:32400
#   token: XXXXXXXX
#   section_id: 12
#   library_path: /Media01/Patreon   # library_dir as Plex sees it

# Like a post on Patreon once its episode is watched in Plex (needs `plex`).
# Downloads never play through Patreon's player, so this is the creator's only sign
# that you watch. Test first with the `likes --dry-run` and `like <post id>` commands.
like_watched: false

creators:
  # Slug from https://www.patreon.com/c/<creator>/posts
  - creator: MandyCaneLane
    # Used in folder names; defaults to the slug.
    creator_name: Mandy Cane Lane
    # Subfolder of library_dir; defaults to creator_name.
    # folder: Mandy Cane Lane
    # Only download posts published on or after this date (omit for the whole archive).
    since: 2026-09-01
    # Cap per run, so a large backlog is spread over several runs (0 = no cap).
    max_downloads_per_run: 10
    # Folder name per source show, and for posts without "SxE" in the title.
    show_name_template: "{creator} - {show}"
    # Show title in Plex. With several creators reacting to the same show, use "{show} ({creator})".
    show_title_template: "{show}"
    misc_show_name: "{creator}"
    # Map alternative spellings to one show name (matching ignores case, spacing and &/and).
    show_aliases: {}
    #   "Fools and Horses": "Only Fools And Horses"
    # Official special (Season 00) numbers, e.g. from TheTVDB. A post "Show - <special>"
    # whose title matches (ignoring case, punctuation, "(...)" and "Special") gets that
    # number and the official title; other specials are numbered around them.
    specials: {}
    #   Only Fools And Horses:
    #     Dates: 8
    #     The Jolly Boys' Outing: 9
