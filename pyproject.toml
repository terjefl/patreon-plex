[project]
name = "patreon-plex"
version = "0.1.0"
description = "Download Patreon videos you have access to into a Plex-friendly TV library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default,curl-cffi]",
    "pyyaml>=6",
]

[project.scripts]
patreon-plex = "patreon_plex.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
