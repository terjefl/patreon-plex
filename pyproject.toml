[project]
name = "mandy"
version = "0.1.0"
description = "Mandy Cane Lane's videos from Patreon in a Plex TV library, with an index page and statistics (YouTube included)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default,curl-cffi]",
    "pyyaml>=6",
    "pillow>=12.3.0",
]

[project.scripts]
mandy = "mandy.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
