services:
  mandy:
    image: ghcr.io/terjefl/mandy:latest
    container_name: mandy
    restart: unless-stopped
    ports:
      - "8400:8000"   # index page (mandy.flagan.net)
    environment:
      - TZ=Europe/Oslo
    volumes:
      - ./config:/config:ro    # config.yaml + cookies.txt
      - ./data:/data
      - /path/to/media/Mandy:/library   # Plex: /Media01/Mandy
